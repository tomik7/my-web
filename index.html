<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow | CS101 Project</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background-color: var(--surface-color);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        header p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1000px;
            width: 90%;
            margin: 40px auto;
            justify-content: center;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            flex: 1;
            min-width: 300px;
        }

        /* TIMER SECTION */
        .timer-container {
            text-align: center;
        }

        .timer-display {
            font-size: 6rem;
            font-weight: 700;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
        }

        .timer-controls button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .timer-controls button:hover {
            background-color: var(--primary-hover);
        }

        .timer-controls button.reset {
            background-color: transparent;
            border: 2px solid var(--text-muted);
            color: var(--text-muted);
        }

        .timer-controls button.reset:hover {
            background-color: rgba(255,255,255,0.05);
        }

        .timer-modes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .timer-modes button {
            background: none;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .timer-modes button.active {
            background: var(--primary-color);
            color: white;
        }

        /* TASKS SECTION */
        .tasks-container h2 {
            margin-top: 0;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-input-group input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 1rem;
        }

        .task-input-group button {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .task-input-group button:hover {
            background-color: #059669;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .task-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .task-text {
            font-size: 1rem;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 10px;
            color: var(--text-muted);
        }

        .task-actions button:hover {
            color: white;
        }

        .task-actions .delete:hover {
            color: var(--danger);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>FocusFlow</h1>
        <p>Web Development Final Project - Productivity Tracker</p>
    </header>

    <main>
        <section class="card timer-container">
            <div class="timer-modes">
                <button class="active" onclick="setMode('pomodoro', 25)" id="btn-pomodoro">Pomodoro</button>
                <button onclick="setMode('short', 5)" id="btn-short">Short Break</button>
                <button onclick="setMode('long', 15)" id="btn-long">Long Break</button>
            </div>
            
            <div class="timer-display" id="time-display">25:00</div>
            
            <div class="timer-controls">
                <button onclick="toggleTimer()" id="start-btn">START</button>
                <button onclick="resetTimer()" class="reset">RESET</button>
            </div>
        </section>

        <section class="card tasks-container">
            <h2>Current Tasks</h2>
            <div class="task-input-group">
                <input type="text" id="task-input" placeholder="What are you working on?">
                <button onclick="addTask()">Add</button>
            </div>
            <ul class="task-list" id="task-list">
                </ul>
        </section>
    </main>

    <footer>
        &copy; 2024 CS101 Web Programming Assignment. All rights reserved.
    </footer>

    <script>
        // --- TIMER LOGIC ---
        let timer;
        let isRunning = false;
        let timeLeft = 25 * 60; // 25 minutes in seconds
        let currentMode = 'pomodoro';

        const display = document.getElementById('time-display');
        const startBtn = document.getElementById('start-btn');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            display.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timer);
                startBtn.textContent = 'START';
                isRunning = false;
            } else {
                timer = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        isRunning = false;
                        startBtn.textContent = 'START';
                        alert('Time is up!');
                    }
                }, 1000);
                startBtn.textContent = 'PAUSE';
                isRunning = true;
            }
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            startBtn.textContent = 'START';
            
            if (currentMode === 'pomodoro') timeLeft = 25 * 60;
            else if (currentMode === 'short') timeLeft = 5 * 60;
            else if (currentMode === 'long') timeLeft = 15 * 60;
            
            updateDisplay();
        }

        function setMode(mode, minutes) {
            currentMode = mode;
            timeLeft = minutes * 60;
            
            document.getElementById('btn-pomodoro').classList.remove('active');
            document.getElementById('btn-short').classList.remove('active');
            document.getElementById('btn-long').classList.remove('active');
            
            document.getElementById(`btn-${mode}`).classList.add('active');
            
            resetTimer();
        }

        // --- TASK LOGIC (Local Storage) ---
        let tasks = JSON.cast || JSON.parse(localStorage.getItem('focusTasks')) || [];

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'task-item';
                
                li.innerHTML = `
                    <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                    <div class="task-actions">
                        <button onclick="toggleTask(${index})">✔</button>
                        <button class="delete" onclick="deleteTask(${index})">✖</button>
                    </div>
                `;
                list.appendChild(li);
            });
            
            localStorage.setItem('focusTasks', JSON.stringify(tasks));
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            
            if (text !== '') {
                tasks.push({ text: text, completed: false });
                input.value = '';
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        // Initial render
        updateDisplay();
        renderTasks();

        // Allow Enter key to add task
        document.getElementById('task-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addTask();
        });
    </script>
</body>
</html>
